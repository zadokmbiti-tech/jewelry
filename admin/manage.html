<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Products - Admin</title>
<link rel="stylesheet" href="admin-styles.css">
<style>
  .admin-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 24px; border-bottom: 1px solid #eee;
  }
  .admin-header a { text-decoration: none; color: #3D2233; font-weight: 600; }
  .manage-list { max-width: 800px; margin: 0 auto; padding: 24px; }
  .manage-row {
    display: flex; align-items: center; gap: 16px;
    padding: 14px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 10px;
  }
  .manage-row img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; background: #f2f2f2; }
  .manage-row .info { flex: 1; }
  .manage-row .name { font-weight: 600; }
  .manage-row .meta { color: #888; font-size: 0.85rem; }
  .manage-row button {
    padding: 6px 14px; border-radius: 4px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 0.85rem;
  }
  .manage-row .delete-btn { color: #c0392b; border-color: #f2c6c1; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    align-items: center; justify-content: center; z-index: 1000;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 10px; padding: 24px; width: 90%; max-width: 420px;
    max-height: 85vh; overflow-y: auto;
  }
  .modal label { display: block; margin-top: 14px; font-weight: 600; font-size: 0.9rem; }
  .modal input, .modal textarea, .modal select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  .modal .actions { margin-top: 18px; display: flex; gap: 10px; }
  .modal .actions button { flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; }
  .modal .save-btn { background: #3D2233; color: #fff; }
  .modal .cancel-btn { background: #eee; }
  #modalPreview { max-width: 100%; margin-top: 8px; border-radius: 6px; display: none; }
</style>
</head>
<body>

<div class="admin-header">
  <span>Manage Products</span>
  <a href="admin.html">+ Add New Product</a>
</div>

<div class="manage-list" id="list">
  <p style="color:#777;">Loading products...</p>
</div>

<!-- Edit modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>Edit Product</h3>
    <form id="editForm">
      <label>Product Name</label>
      <input type="text" id="editName" required>

      <label>Description</label>
      <textarea id="editDescription" rows="3"></textarea>

      <label>Price (KES)</label>
      <input type="number" id="editPrice" required>

      <label>Category</label>
      <select id="editCategory" required>
        <option value="xuping-sets">Xuping Sets</option>
        <option value="xuping-earrings">Xuping Earrings</option>
        <option value="genuine-leather-belts">Genuine Leather Belts</option>
        <option value="kids-xuping-earrings">Kids Xuping Earrings</option>
        <option value="xuping-necklaces">Xuping Necklaces</option>
        <option value="pearl-necklaces">Pearl Necklaces</option>
        <option value="P.u-leather-belts">P.U Leather Belts</option>
        <option value="male-stainless-steel-sets">Male Stainless Steel Sets</option>
        <option value="statement-stainless-earrings">Statement Stainless Earrings</option>
        <option value="fashion-jewelry-necklace-sets">Fashion Jewelry Necklace Sets</option>
      </select>

      <label>Materials (comma-separated)</label>
      <input type="text" id="editMaterials" placeholder="18k Gold Vermeil, Sterling Silver">

      <label><input type="checkbox" id="editIsNew" style="width:auto; display:inline-block;"> Mark as New</label>

      <label>Current Images</label>
      <div id="currentImagesRow" style="display:flex; gap:8px; margin-top:4px;"></div>

      <label>Replace Images (optional — choose 1–3 to replace all current images; leave blank to keep them)</label>
      <input type="file" id="editImageFiles" accept="image/*" multiple>
      <div id="modalPreviewRow" style="display:flex; gap:8px; margin-top:8px;"></div>

      <div class="actions">
        <button type="button" class="cancel-btn" id="cancelBtn">Cancel</button>
        <button type="submit" class="save-btn" id="saveBtn">Save Changes</button>
      </div>
      <div id="modalStatus" style="margin-top:10px; font-weight:600;"></div>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script src="admin-auth.js"></script>
<script>
requireAdminLogin();

let editingId = null;

// Reads a File into a base64 string (no data-URL prefix) for sending as
// JSON to /api/upload.
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Splits the comma-separated materials input into a clean string array,
// matching the `materials: list[str]` shape main.py expects.
function parseMaterials(raw) {
  return raw.split(',').map(m => m.trim()).filter(Boolean);
}

const CATEGORY_LABELS = {
  'xuping-sets': 'Xuping Sets',
  'xuping-earrings': 'Xuping Earrings',
  'genuine-leather-belts': 'Genuine Leather Belts',
  'kids-xuping-earrings': 'Kids Xuping Earrings',
  'xuping-necklaces': 'Xuping Necklaces',
  'pearl-necklaces': 'Pearl Necklaces',
  'P.u-leather-belts': 'P.U Leather Belts',
  'male-stainless-steel-sets': 'Male Stainless Steel Sets',
  'statement-stainless-earrings': 'Statement Stainless Earrings',
  'fashion-jewelry-necklace-sets': 'Fashion Jewelry Necklace Sets'
};

const MAX_IMAGES = 3;

async function loadList() {
  const list = document.getElementById('list');
  try {
    const res = await fetch(`${API_URL}/products`);
    const products = await res.json();
    if (products.length === 0) {
      list.innerHTML = '<p style="color:#777;">No products yet. <a href="admin.html">Add one</a>.</p>';
      return;
    }
    list.innerHTML = products.map(p => `
      <div class="manage-row">
        <img src="${p.image_url || 'https://placehold.co/100x100?text=No+Image'}" alt="${p.name}">
        <div class="info">
          <div class="name">${p.name}</div>
          <div class="meta">KES ${p.price.toLocaleString()} — ${CATEGORY_LABELS[p.category] || p.category}</div>
        </div>
        <button onclick="openEdit(${p.id})">Edit</button>
        <button class="delete-btn" onclick="deleteProduct(${p.id})">Delete</button>
      </div>
    `).join('');
  } catch (err) {
    list.innerHTML = '<p style="color:#c0392b;">Could not load products. Is the backend running?</p>';
  }
}

async function openEdit(id) {
  const res = await fetch(`${API_URL}/products/${id}`);
  if (!res.ok) return alert('Could not load product');
  const p = await res.json();

  editingId = id;
  document.getElementById('editName').value = p.name;
  document.getElementById('editDescription').value = p.description || '';
  document.getElementById('editPrice').value = p.price;
  document.getElementById('editCategory').value = p.category;
  document.getElementById('editMaterials').value = (p.materials || []).join(', ');
  document.getElementById('editIsNew').checked = p.is_new;
  document.getElementById('editImageFiles').value = '';
  document.getElementById('modalPreviewRow').innerHTML = '';

  const currentRow = document.getElementById('currentImagesRow');
  currentRow.innerHTML = (p.images && p.images.length)
    ? p.images.map(src => `<img src="${src}" style="width:70px;height:70px;object-fit:cover;border-radius:6px;">`).join('')
    : '<span style="color:#999; font-size:0.85rem;">No images yet</span>';

  document.getElementById('modalStatus').textContent = '';
  document.getElementById('modalOverlay').classList.add('open');
}

document.getElementById('cancelBtn').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.remove('open');
});

document.getElementById('editImageFiles').addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  const status = document.getElementById('modalStatus');
  if (files.length > MAX_IMAGES) {
    status.textContent = `❌ Choose at most ${MAX_IMAGES} images.`;
    e.target.value = '';
    document.getElementById('modalPreviewRow').innerHTML = '';
    return;
  }
  status.textContent = '';
  document.getElementById('modalPreviewRow').innerHTML = files.map(f =>
    `<img src="${URL.createObjectURL(f)}" style="width:70px;height:70px;object-fit:cover;border-radius:6px;">`
  ).join('');
});

document.getElementById('editForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const saveBtn = document.getElementById('saveBtn');
  const status = document.getElementById('modalStatus');
  saveBtn.disabled = true;
  status.textContent = 'Saving...';

  try {
    // Step 1: update product fields
    const updateRes = await adminFetch(`${API_URL}/admin/products/${editingId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('editName').value,
        description: document.getElementById('editDescription').value,
        price: parseFloat(document.getElementById('editPrice').value),
        category: document.getElementById('editCategory').value,
        materials: parseMaterials(document.getElementById('editMaterials').value),
        is_new: document.getElementById('editIsNew').checked
      })
    });
    if (!updateRes.ok) throw new Error('Failed to update product details');

    // Step 2: replace images, only if new files were chosen — clear the old
    // set first, then upload and link the new ones (1-3) in order.
    const imageFiles = Array.from(document.getElementById('editImageFiles').files);
    if (imageFiles.length > MAX_IMAGES) throw new Error(`Choose at most ${MAX_IMAGES} images`);

    if (imageFiles.length > 0) {
      const clearRes = await adminFetch(`${API_URL}/admin/products/${editingId}/images`, { method: 'DELETE' });
      if (!clearRes.ok) throw new Error('Failed to clear old images');

      for (let i = 0; i < imageFiles.length; i++) {
        const file = imageFiles[i];
        status.textContent = `Uploading image ${i + 1} of ${imageFiles.length}...`;

        const dataBase64 = await fileToBase64(file);
        const uploadRes = await adminFetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: file.name, contentType: file.type, dataBase64 })
        });
        const uploadData = await uploadRes.json();
        if (!uploadRes.ok) throw new Error(uploadData.error || `Image ${i + 1} upload failed`);

        const imgRes = await adminFetch(`${API_URL}/admin/products/${editingId}/images`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ blob_url: uploadData.url, is_primary: i === 0, sort_order: i })
        });
        if (!imgRes.ok) throw new Error(`Linking image ${i + 1} failed`);
      }
    }

    status.textContent = '✅ Saved!';
    setTimeout(() => {
      document.getElementById('modalOverlay').classList.remove('open');
      loadList();
    }, 500);

  } catch (err) {
    status.textContent = '❌ ' + err.message;
  } finally {
    saveBtn.disabled = false;
  }
});

async function deleteProduct(id) {
  if (!confirm('Delete this product? This cannot be undone.')) return;
  const res = await adminFetch(`${API_URL}/admin/products/${id}`, { method: 'DELETE' });
  if (res.ok) {
    loadList();
  } else {
    alert('Could not delete product.');
  }
}

loadList();
</script>

</body>
</html>
