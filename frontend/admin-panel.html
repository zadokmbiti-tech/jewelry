    <div class="msu-body">
      <div class="msu-title">
        <h3>Admin Login</h3>
        <p>Manage the Sj Gems Jewelry Store catalogue</p>
      </div>
      <div class="auth-err" id="adminLoginErr">Incorrect password.</div>
      <div class="msu-row">
        <label for="adminPasswordInput">Password:</label>
        <div class="auth-field">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
          <input type="password" id="adminPasswordInput" placeholder="Password" autocomplete="off" onkeydown="if(event.key==='Enter')submitAdminLogin()">
          <button type="button" class="auth-toggle-pw" onclick="toggleAdminPwVisibility()" aria-label="Show password">
            <svg id="adminPwEye" viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="msu-divider"></div>
      <div class="msu-actions">
        <button type="button" class="msu-forgot" onclick="alert('Contact the store owner to reset the admin password.')">Forgot password?</button>
        <a class="btn-primary msu-signin" onclick="submitAdminLogin()">Sign In</a>
      </div>
      <p class="auth-note">Restricted to store administrators only.</p>
    </div>
  </div>
</div>

<div class="admin-panel" id="adminPanel">
  <div class="admin-topbar">
    <div class="logo">Sj Gems Jewelry Store<span>.</span> Admin</div>
    <div class="admin-tabs">
      <button class="admin-tab active" id="tabAddBtn" onclick="showAdminTab('add')">Add Product</button>
      <button class="admin-tab" id="tabManageBtn" onclick="showAdminTab('manage')">Manage Products</button>
      <button class="admin-tab" id="tabOrdersBtn" onclick="showAdminTab('orders')">Orders</button>
      <button class="admin-tab" id="tabCustomersBtn" onclick="showAdminTab('customers')">Customers</button>
    </div>
    <div>
      <a class="admin-logout" onclick="adminLogout()">Log Out &amp; Close</a>
    </div>
  </div>

  <div class="admin-body" id="adminAddView">
    <h2>Add New Piece</h2>
    <div class="a-pending-banner" id="apPendingBanner" style="display:none;"></div>
    <form id="addProductForm">
      <div class="a-field"><label>Product Name</label><input type="text" id="apName" required></div>
      <div class="a-field"><label>Description</label><textarea id="apDescription" rows="3"></textarea></div>
      <div class="a-field"><label>Price (KES)</label><input type="number" id="apPrice" required></div>
      <div class="a-field"><label>Sale Price (optional)</label><input type="number" id="apSalePrice" min="0" placeholder="Leave blank for no sale"></div>
      <div class="a-field">
        <label>Category</label>
        <select id="apCategory" required>
          <optgroup label="Necklaces">
            <option value="xuping-necklaces">Xuping Necklaces</option>
            <option value="pearl-necklaces">Pearl Necklaces</option>
            <option value="stainless-steel-necklaces">Stainless Steel Necklaces</option>
            <option value="brass-necklaces">Brass Necklaces</option>
          </optgroup>
          <optgroup label="Earrings">
            <option value="xuping-earrings">Xuping Earrings</option>
            <option value="kids-xuping-earrings">Kids Xuping Earrings</option>
            <option value="statement-stainless-earrings">Statement Stainless Earrings</option>
          </optgroup>
          <optgroup label="Rings">
            <option value="anxiety-rings">Anxiety Rings</option>
            <option value="brass-rings">Brass Rings</option>
            <option value="stainless-steel-rings">Stainless Steel Rings</option>
            <option value="xuping-rings">Xuping Rings</option>
            <option value="statement-rings">Statement Rings</option>
          </optgroup>
          <optgroup label="Bracelets &amp; Bangles">
            <option value="tennis-bracelets">Tennis Bracelets</option>
            <option value="xuping-bangles">Xuping Bangles</option>
            <option value="xuping-tennis-bracelets">Xuping Tennis Bracelets</option>
            <option value="xuping-bracelets">Xuping Bracelets</option>
          </optgroup>
          <optgroup label="Jewelry Sets">
            <option value="xuping-sets">Xuping Sets</option>
            <option value="male-stainless-steel-sets">Male Stainless Steel Sets</option>
            <option value="fashion-jewelry-necklace-sets">Fashion Jewelry Necklace Sets</option>
          </optgroup>
          <optgroup label="Watches">
            <option value="hypoallergenic-watches">Hypoallergenic Watches</option>
            <option value="genuine-leather-watches">Genuine Leather Watches</option>
            <option value="magnetic-and-generic-watches">Magnetic and Generic Watches</option>
            <option value="kids-digital-watches">Kids Digital Watches</option>
            <option value="mens-watches">Men's Watches</option>
          </optgroup>
          <optgroup label="Belts">
            <option value="genuine-leather-belts">Genuine Leather Belts</option>
            <option value="pu-leather-belts">P.U Leather Belts</option>
          </optgroup>
          <optgroup label="Headbands &amp; Hair Accessories">
            <option value="twist-fabric-headband">Twist Fabric Headband</option>
            <option value="pearl-twist-headband">Pearl Twist Headband</option>
            <option value="ruched-rhinestone-headband">Ruched Rhinestone Headband</option>
            <option value="pearl-and-rhinestones-headband">Pearl & Rhinestones Headband</option>
            <option value="crystal-satin-ruche-headband">Crystal Satin Ruche Headband</option>
            <option value="hair-clips">Hair Clips</option>
          </optgroup>
          <optgroup label="Eyewear">
            <option value="sunglasses">Sunglasses</option>
            <option value="photochromic-glasses">Photochromic Glasses</option>
            <option value="anti-blue-light-glasses">Anti-Blue Light Glasses</option>
          </optgroup>
          <optgroup label="Bags">
            <option value="travel-bags">Travel Bags</option>
          </optgroup>
          <optgroup label="Mirrors">
            <option value="kids-pocket-mirrors">Kids Pocket Mirrors</option>
            <option value="adult-pocket-mirrors">Adult Pocket Mirrors</option>
          </optgroup>
          <optgroup label="Jewelry Storage &amp; Cases">
            <option value="elite-compact-jewelry-case">Elite Compact Jewelry Case</option>
            <option value="classic-jewelry-organizers">Classic Jewelry Organizers</option>
          </optgroup>
          <optgroup label="Other Accessories &amp; Gifts">
            <option value="brass-jewelry">Brass Jewelry</option>
            <option value="charger-protectors">Charger Protectors</option>
            <option value="premium-wine-bottle-gift-box">Premium Wine Bottle Gift Box</option>
            <option value="bag-charms">Bag Charms</option>
            <option value="other_items">Other Items</option>
          </optgroup>
        </select>
      </div>
      <div class="a-field"><label>Quantity Available</label><input type="number" id="apQuantity" min="0" value="1" required></div>
      <div class="a-check"><input type="checkbox" id="apIsNew" checked><label style="margin:0;text-transform:none;letter-spacing:0;color:var(--ink);">Mark as New</label></div>
      <div class="a-field">
        <label>Product Photos &amp; Demo Videos (1–10)</label>
        <input type="file" id="apImageFiles" accept="image/*,video/*" multiple required>
        <div class="a-preview-row" id="apPreviewRow"></div>
      </div>
      <a class="btn-primary a-submit" id="apSubmitBtn" onclick="submitAddProduct(event)">Add Product</a>
      <div class="a-status" id="apStatus"></div>
    </form>
  </div>

  <div class="admin-body" id="adminManageView" style="display:none;">
    <h2>Manage Products</h2>
    <input type="text" class="a-manage-search" id="manageSearchInput" placeholder="Search by product name, category, or price…" oninput="filterManageList()">
    <div class="a-manage-count" id="manageCount"></div>
    <div id="manageList"><p style="color:var(--muted);">Loading…</p></div>
  </div>

  <div class="admin-body" id="adminOrdersView" style="display:none;">
    <h2>Orders</h2>
    <div id="ordersList"><p style="color:var(--muted);">Loading…</p></div>
  </div>

  <div class="admin-body" id="adminCustomersView" style="display:none;">
    <h2>Customers</h2>
    <div id="customersList"><p style="color:var(--muted);">Loading…</p></div>
  </div>
</div>
